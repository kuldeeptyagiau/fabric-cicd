#     scriptType: bash
#     scriptLocation: inlineScript
#     failOnStandardError: true
#     inlineScript: |
#       set -e

#       chmod +x utils/fabric-access-check.sh
#       ./utils/fabric-access-check.sh

# ============================
# DEPLOY FUNCTION 
# ============================
- task: AzureCLI@2
  displayName: '🚀 Deploy to ${{ parameters.targetEnv }} fabric workspace'
  inputs:
    azureSubscription: 'fabric-cicd-dev-spn'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🚀 Deploying to ${{ parameters.targetEnv }}"

      export FABRIC_TENANT_ID="$(FABRIC_TENANT_ID)"
      export FABRIC_CLIENT_ID="$(FABRIC_CLIENT_ID)"

      export TARGET_ENV="${{ parameters.targetEnv }}"
      python deploy.py


