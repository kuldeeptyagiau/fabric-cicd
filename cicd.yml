trigger:
  branches:
    include:
      - main
  paths:
    include:
      - fabric/**

parameters:
  - name: targetEnv
    type: string
    default: dev
    values:
      - dev
      - sandpit
      # - test 

variables:
- group: fabric-cicd-config 

# Workspace mapping (REPLACES config.yml)
# - name: DEV_WORKSPACE_ID
#   value: 7d828536-a77b-4966-811c-c3b7a0c2770b

# - name: SANDPIT_WORKSPACE_ID
#   value: 6dbc43f2-b760-4fd8-873c-2889dd7eb78d

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self

- script: |
    python -m pip install --upgrade pip
    python -m pip install fabric-cicd
  displayName: 'Install fabric-cicd library'

# # =========================
