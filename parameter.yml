find_replace:
    - find_value: "20050383-1ca2-4e8f-bfd8-3acafd8ddc2c" # lakehouse guid bronze to be replaced , this is dev
      replace_value:
          dev: "20050383-1ca2-4e8f-bfd8-3acafd8ddc2c"  
          sandpit: "e488e40e-7efa-4885-ae08-f37074408af5"
          # TEST: "e488e40e-7efa-4885-ae08-f37074408af5"
          # PROD: "prod-lakehouse-id"

# lakehouse workspace ID to be replaced (using regex pattern) in notebook
    - find_value:  \#\s*META\s+"default_lakehouse_workspace_id":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
      replace_value:
          _ALL_: "$workspace.$id"  #workspace ID of the target environment (dynamic)
      is_regex: "true"
      file_path: "**/notebook-content.py"

key_value_replace:
  - find_key: $.properties.activities[*]..workspaceId  
    replace_value:
        dev: "7d828536-a77b-4966-811c-c3b7a0c2770b"
        sandpit: "6dbc43f2-b760-4fd8-873c-2889dd7eb78d"
    #   TEST: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    #   PROD: "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
    item_type: "DataPipeline" 
    item_name: ["Pl__EOMA", "Pl__Expense_Journal"] # filter on specific pipeline

  - find_key: $.properties.activities[*].typeProperties.source..workspaceId 
    replace_value:
        dev: "7d828536-a77b-4966-811c-c3b7a0c2770b"
        sandpit: "6dbc43f2-b760-4fd8-873c-2889dd7eb78d"
    #   TEST: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    #   PROD: "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
    item_type: "DataPipeline" 
    item_name: ["Pl__Export_EOM_Data", "Pl__Export_ExpJournal_Data"] # filter on specific pipeline    

# To write to dev-finops and prod-finops workspaceId
  - find_key: $.properties.activities[*].typeProperties.sink..workspaceId
    replace_value:
        dev: "30bed2ca-613d-4599-ba23-af433407521c" # In dev and sandpit both writing to dev-finops
        sandpit: "30bed2ca-613d-4599-ba23-af433407521c"
    #   TEST: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    #   PROD: "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
    item_type: "DataPipeline" 
    item_name: ["Pl__Export_EOM_Data", "Pl__Export_ExpJournal_Data"] # filter on specific pipeline    

# To write to dev-finops and prod-finops lakehouseId
  - find_key: $.properties.activities[*].typeProperties.sink..artifactId
    replace_value:
        dev: "c5970f9a-a714-4eb7-83c8-7dcc73499a76" # In dev and sandpit both writing to dev-finops
        sandpit: "c5970f9a-a714-4eb7-83c8-7dcc73499a76"
    #   TEST: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    #   PROD: "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
    item_type: "DataPipeline" 
    item_name: ["Pl__Export_EOM_Data", "Pl__Export_ExpJournal_Data"] # filter on specific pipeline          

# Workspace Identity to Invoke Pipeline
  - find_key: $.properties.activities[*].externalReferences.connection
    replace_value:
      dev: "af77dd0e-5de6-4626-8938-b5c96c609777"  # "-DATA-PLATFORM-DEV - Workspace Identity" to invoke pipeline
      sandpit: "224a29aa-179f-4572-a609-f7838f420ca7" # -DATA-PLATFORM-SANDPIT - Workspace Identity
    #   TEST: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    #   PROD: "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
    item_type: "DataPipeline"
    item_name: "Pl__Master"   
    # file_path: "Pl__Master**/*.json"

  - find_key: $.schedules[?(@.jobType=="Execute")].enabled
    replace_value:
        dev: false
        sandpit: false
        # TEST: false
        # PROD: true
    file_path: "**/.schedules"

